<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покупка Голды</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #242424);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; font-size: 22px; }
        .input-group {
            margin: 20px 0;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #888;
            display: block;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #121212;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #2481cc; }
        .price-calculator {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            color: #2ecc71;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>


<div class="card">
    <h2>🪙 Покупка Голды</h2>
    
    <div class="input-group">
        <label for="gold-amount">Введите количество голды:</label>
        <input type="number" id="gold-amount" value="100" min="10" placeholder="Например: 500">
    </div>


    <!-- Отображение рассчёта стоимости -->
    <div class="price-calculator">
        К оплате: <span id="total-price">1.00</span> USDT
    </div>


    <button id="pay-btn">Оплатить через Crypto Bot</button>
</div>


<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();


    // Курс: 1 Голда = 0.01 USDT (Измените под свой курс!)
    const PRICE_PER_GOLD = 0.01;


    const goldInput = document.getElementById('gold-amount');
    const totalPriceSpan = document.getElementById('total-price');
    const payBtn = document.getElementById('pay-btn');


    // Функция перерасчета цены при изменении поля ввода
    goldInput.addEventListener('input', () => {
        let gold = parseFloat(goldInput.value) || 0;
        let total = (gold * PRICE_PER_GOLD).toFixed(2);
        totalPriceSpan.innerText = total;
    });


    payBtn.addEventListener('click', async () => {
        const userId = tg.initDataUnsafe?.user?.id;
        const goldAmount = parseInt(goldInput.value);


        if (!userId) {
            alert("Не удалось определить ваш Telegram ID");
            return;
        }


        if (!goldAmount || goldAmount < 10) {
            alert("Минимальный заказ — 10 голды!");
            return;
        }


        payBtn.disabled = true;
        payBtn.innerText = "Создаем чек...";


        try {
            // Отправляем запрос на сервер Python
            const response = await fetch('/create-invoice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    gold_amount: goldAmount
                })
            });


            const data = await response.json();


            if (data.pay_url) {
                // Переходим к оплате в Crypto Bot
                tg.openTelegramLink(data.pay_url);
            } else {
                alert('Ошибка создания счета: ' + (data.detail || 'Попробуйте позже'));
            }
        } catch (e) {
            console.error(e);
            alert('Ошибка связи с сервером');
        } finally {
            payBtn.disabled = false;
            payBtn.innerText = "Оплатить через Crypto Bot";
        }
    });
</script>


</body>
</html>
