<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Market App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --card-border: #2a2a32;
      --accent-red: #ff3b3b;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --green-btn: #28a745;
      --yellow-btn: #f1c40f;
    }


    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 80px; }


    .header {
      background: linear-gradient(180deg, #1f0808 0%, var(--bg-color) 100%);
      padding: 16px; text-align: center; border-bottom: 1px solid rgba(255, 59, 59, 0.2);
    }
    .app-title { font-size: 20px; font-weight: 900; color: var(--accent-red); }
    .user-info { margin-top: 4px; font-size: 13px; color: var(--text-muted); }


    .container { padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }


    .section-title { font-size: 16px; font-weight: 700; margin: 15px 0 10px 4px; }
    
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }
    .card-highlight { border-color: var(--accent-red); }
    .badge { display: inline-block; background: var(--accent-red); color: #fff; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; }


    .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn-red { background: var(--accent-red); color: #fff; }
    .btn-green { background: var(--green-btn); color: #fff; }
    .btn-yellow { background: var(--yellow-btn); color: #000; }
    .btn-disabled { background: #333 !important; color: #777 !important; cursor: not-allowed; }


    input, select {
      width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px;
      border: 1px solid var(--card-border); background: #222; color: #fff; font-size: 14px;
    }


    /* Сетка для Мин */
    .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0; }
    .mine-cell { aspect-ratio: 1; background: #222; border-radius: 8px; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }


    /* Навигация */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
      background: #121215; border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; cursor: pointer; flex: 1; }
    .nav-item.active { color: var(--accent-red); }
    .admin-tab { display: none; }
  </style>
</head>
<body>


  <div class="header">
    <div class="app-title">MARKET APP</div>
    <div class="user-info" id="username-display">Загрузка...</div>
  </div>


  <div class="container">


    <!-- 1. ГЛАВНОЕ МЕНЮ -->
    <div id="tab-home" class="tab-content active">
      <div class="section-title">🔥 Розыгрыши</div>
      <div id="giveaways-container"><div class="card">Загрузка...</div></div>


      <div class="section-title">🎁 Ежедневный бонус</div>
      <div class="card">
        <div>Забирай от <b>1.0</b> до <b>5.0 Gold</b> каждые 24 часа!</div>
        <div id="bonus-timer" style="font-size: 12px; color: var(--accent-red); margin: 6px 0; display: none;"></div>
        <button id="bonus-btn" class="btn btn-green" onclick="claimDailyBonus()">Забрать бонус</button>
      </div>
    </div>


    <!-- 2. РЫНОК -->
    <div id="tab-market" class="tab-content">
      <div class="section-title">🛒 Рынок активов</div>
      <div class="card">
        <div class="card-title">Создать свой лот</div>
        <input type="text" id="lot-title" placeholder="Название лота / акции">
        <input type="number" id="lot-price" placeholder="Цена (Gold)">
        <button class="btn btn-red" onclick="createMarketLot()">Выставить на продажу</button>
      </div>
      <div id="market-container"></div>
    </div>


    <!-- 3. ИГРЫ (МИНЫ & АПГРЕЙД) -->
    <div id="tab-games" class="tab-content">
      <div class="section-title">💣 Игра "Мины"</div>
      <div class="card">
        <button class="btn btn-red" onclick="startMines()">Старт (Ставка 5 Gold)</button>
        <div class="mines-grid" id="mines-grid"></div>
      </div>


      <div class="section-title">🎡 Колесо Апгрейда</div>
      <div class="card" style="text-align: center;">
        <div id="wheel-status" style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">❓</div>
        <button class="btn btn-yellow" onclick="spinWheel()">Крутить Апгрейд (Ставка 10 Gold)</button>
      </div>
    </div>


    <!-- 4. ПРОФИЛЬ & ПОПОЛНЕНИЕ / ВЫВОД -->
    <div id="tab-profile" class="tab-content">
      <div class="section-title">👤 Профиль</div>
      <div class="card">
        <div>Баланс: <b id="profile-balance" style="color: var(--accent-red); font-size: 20px;">0.0 ⚜️</b></div>
      </div>


      <div class="section-title">💳 Пополнение</div>
      <div class="card">
        <button class="btn btn-yellow" onclick="payStars()">Пополнить через Telegram Stars ⭐</button>
        <button class="btn btn-green" onclick="payKB()">Пополнить через KB (CryptoBot)</button>
      </div>


      <div class="section-title">📤 Вывод Gold</div>
      <div class="card">
        <input type="number" id="withdraw-amount" placeholder="Сумма вывода (Gold)">
        <input type="text" id="withdraw-screen" placeholder="Ссылка на скриншот предмета">
        <button class="btn btn-red" onclick="requestWithdraw()">Подать заявку на вывод</button>
      </div>
    </div>


    <!-- 5. АДМИНКА -->
    <div id="tab-admin" class="tab-content">
      <div class="section-title">⚙️ Админ Панель</div>
      <div class="card">
        <div class="card-title">Создать Конкурс</div>
        <input type="text" id="gw-title" placeholder="Название">
        <input type="text" id="gw-prize" placeholder="Приз">
        <input type="number" id="gw-winners" placeholder="Кол-во победителей">
        
        <select id="gw-type" onchange="toggleGwFields()">
          <option value="free">Бесплатный</option>
          <option value="paid">Платный (1-30 Gold)</option>
          <option value="sponsor">За подписку</option>
        </select>


        <input type="number" id="gw-fee" placeholder="Цена участия (1-30 G)" style="display:none;">
        <input type="text" id="gw-sponsor-link" placeholder="Ссылка на канал" style="display:none;">
        <input type="number" id="gw-duration" placeholder="Длительность (часов)">


        <button class="btn btn-red" onclick="createGiveaway()">Опубликовать</button>
      </div>
    </div>


  </div>


  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span><span>Главная</span></div>
    <div class="nav-item" onclick="switchTab('market', this)"><span>🛒</span><span>Рынок</span></div>
    <div class="nav-item" onclick="switchTab('games', this)"><span>🎮</span><span>Игры</span></div>
    <div class="nav-item" onclick="switchTab('profile', this)"><span>👤</span><span>Профиль</span></div>
    <div class="nav-item admin-tab" id="admin-nav" onclick="switchTab('admin', this)"><span>⚙️</span><span>Админка</span></div>
  </div>


  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();


    const WORKER_URL = "https://blue-sky-8503marketgold.m-p-2003cat.workers.dev";
    let user = tg.initDataUnsafe?.user || { id: 0, first_name: "Игрок" };
    let lastBonusTime = 0;


    document.getElementById("username-display").innerText = `${user.first_name} (ID: ${user.id})`;


    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      el.classList.add('active');
      if (tabName === 'market') loadMarket();
    }


    function toggleGwFields() {
      const type = document.getElementById("gw-type").value;
      document.getElementById("gw-fee").style.display = (type === "paid") ? "block" : "none";
      document.getElementById("gw-sponsor-link").style.display = (type === "sponsor") ? "block" : "none";
    }


    async function init() {
      try {
        const res = await fetch(`${WORKER_URL}/api/user-info`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: user.id })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("profile-balance").innerText = `${data.balance} ⚜️`;
          lastBonusTime = data.lastBonus;
          if (data.isAdmin) document.getElementById("admin-nav").style.display = "flex";
        }
      } catch (e) {}
      loadGiveaways();
    }


    // --- РОЗЫГРЫШИ & БОНУС ---
    async function loadGiveaways() {
      const container = document.getElementById("giveaways-container");
      try {
        const res = await fetch(`${WORKER_URL}/api/giveaways`);
        const data = await res.json();
        if (data.success && data.giveaways.length > 0) {
          container.innerHTML = data.giveaways.map(g => {
            const isParticipating = g.participants?.includes(user.id);
            const count = g.participants?.length || 0;
            const timeLeft = Math.max(0, Math.floor(((g.createdAt + (g.durationHours || 24) * 3600000) - Date.now()) / 3600000));


            let btn = `<button class="btn btn-red" onclick="joinGiveaway(${g.id})">Участвовать</button>`;
            if (g.type === "paid") btn = `<button class="btn btn-red" onclick="joinGiveaway(${g.id})">Участвовать (${g.entryFee} G)</button>`;
            if (g.type === "sponsor") btn = `<a href="${g.sponsorLink}" target="_blank" class="btn btn-green" style="display:block; text-align:center; text-decoration:none;">1. Подписаться</a><button class="btn btn-red" onclick="joinGiveaway(${g.id})">2. Проверить</button>`;
            if (isParticipating) btn = `<button class="btn btn-disabled" disabled>✅ Вы участвуете</button>`;


            return `<div class="card card-highlight">
              <div class="badge">${g.type === 'paid' ? '💰 Платный' : g.type === 'sponsor' ? '📢 Подписка' : '🎁 Бесплатный'}</div>
              <div class="card-title">${g.title}</div>
              <div style="font-size:12px; color:#8e8e93; margin: 4px 0 10px;">Приз: <b>${g.prize}</b> | Участников: <b>${count}</b> | Осталось: ~<b>${timeLeft}ч</b></div>
              ${btn}
            </div>`;
          }).join('');
        } else { container.innerHTML = `<div class="card">Розыгрышей нет.</div>`; }
      } catch (e) {}
    }


    async function joinGiveaway(giveawayId) {
      const res = await fetch(`${WORKER_URL}/api/join-giveaway`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id, giveawayId })
      });
      const data = await res.json();
      if (data.success) { tg.showAlert("🎉 Вы участвуете!"); init(); } else { tg.showAlert(data.message); }
    }


    async function claimDailyBonus() {
      const res = await fetch(`${WORKER_URL}/api/daily-bonus`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id })
      });
      const data = await res.json();
      if (data.success) { tg.showAlert(`🎉 Бонус: ${data.reward} Gold!`); init(); } else { tg.showAlert(data.message); }
    }


    // --- РЫНОК ---
    async function loadMarket() {
      const res = await fetch(`${WORKER_URL}/api/market`);
      const data = await res.json();
      const container = document.getElementById("market-container");
      if (data.success) {
        container.innerHTML = data.lots.map(l => `<div class="card">
          <div class="card-title">${l.title}</div>
          <div>Цена: <b>${l.price} Gold</b></div>
          <button class="btn btn-green" onclick="tg.showAlert('Куплено!')">Купить</button>
        </div>`).join('');
      }
    }


    async function createMarketLot() {
      const title = document.getElementById("lot-title").value;
      const price = document.getElementById("lot-price").value;
      if (!title || !price) return tg.showAlert("Заполните все поля!");
      await fetch(`${WORKER_URL}/api/market/add`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id, title, price })
      });
      tg.showAlert("Лот выставлен!"); loadMarket();
    }


    // --- ИГРЫ ---
    function startMines() {
      const grid = document.getElementById("mines-grid");
      grid.innerHTML = "";
      const bombIndex = Math.floor(Math.random() * 25);
      for (let i = 0; i < 25; i++) {
        const cell = document.createElement("div");
        cell.className = "mine-cell";
        cell.onclick = () => {
          if (i === bombIndex) { cell.innerText = "💣"; cell.style.background = "red"; tg.showAlert("Бум! Вы проиграли"); }
          else { cell.innerText = "💎"; cell.style.background = "green"; }
        };
        grid.appendChild(cell);
      }
    }


    function spinWheel() {
      const win = Math.random() > 0.5;
      document.getElementById("wheel-status").innerText = win ? "🎉 Выиграл +20 G!" : "💥 Проиграл!";
    }


    // --- ОПЛАТА & ВЫВОД ---
    function payStars() { tg.showAlert("Переход к оплате Telegram Stars..."); }
    function payKB() { tg.showAlert("Открытие CryptoBot..."); }


    async function requestWithdraw() {
      const amount = parseFloat(document.getElementById("withdraw-amount").value);
      const screenshotUrl = document.getElementById("withdraw-screen").value;
      if (!amount || !screenshotUrl) return tg.showAlert("Заполните сумму и ссылку на скрин!");
      
      const res = await fetch(`${WORKER_URL}/api/withdraw`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id, amount, screenshotUrl })
      });
      const data = await res.json();
      if (data.success) { tg.showAlert("✅ Заявка отправлена!"); init(); } else { tg.showAlert(data.message); }
    }


    async function createGiveaway() {
      const title = document.getElementById("gw-title").value;
      const prize = document.getElementById("gw-prize").value;
      const winners = document.getElementById("gw-winners").value;
      const type = document.getElementById("gw-type").value;
      const entryFee = document.getElementById("gw-fee").value;
      const sponsorLink = document.getElementById("gw-sponsor-link").value;
      const durationHours = document.getElementById("gw-duration").value;


      await fetch(`${WORKER_URL}/api/create-giveaway`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: user.id, title, prize, winners, type, entryFee, sponsorLink, durationHours })
      });
      tg.showAlert("✅ Конкурс создан!"); loadGiveaways();
    }


    init();
  </script>
</body>
</html>
